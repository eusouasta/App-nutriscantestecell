<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#EAF7EC" />
  <title>NutriScan — Escaneie seu prato</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <header class="topbar">
      <div class="brand">
        <span class="brand-leaf">🌿</span>
        <span class="brand-name">NutriScan</span>
      </div>
      <button class="icon-btn" id="historyBtn" aria-label="Histórico" title="Em breve">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 8v4l3 3M21 12a9 9 0 1 1-9-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <main class="scanner" id="scannerView">

      <p class="scanner-eyebrow">O que você vai comer?</p>
      <h1 class="scanner-title">Escaneie seu prato</h1>

      <div class="viewfinder" id="viewfinder">
        <img id="previewImg" class="preview-img hidden" alt="Prévia da foto" />
        <div class="viewfinder-empty" id="viewfinderEmpty">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none"><path d="M4 8V6a2 2 0 0 1 2-2h2M20 8V6a2 2 0 0 0-2-2h-2M4 16v2a2 2 0 0 0 2 2h2M20 16v2a2 2 0 0 1-2 2h-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="3.5" stroke="currentColor" stroke-width="1.8"/></svg>
          <span>Aponte pro prato ou envie uma foto</span>
        </div>
        <div class="viewfinder-loading hidden" id="viewfinderLoading">
          <div class="spinner"></div>
          <span id="loadingLabel">Identificando os alimentos…</span>
        </div>
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
      </div>

      <div class="action-row">
        <button class="btn btn-primary" id="cameraBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 8V6a2 2 0 0 1 2-2h1l1.5-2h7L17 4h1a2 2 0 0 1 2 2v2M4 8v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M4 8h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="14" r="3.2" stroke="currentColor" stroke-width="1.8"/></svg>
          Tirar foto
        </button>
        <button class="btn btn-secondary" id="galleryBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="m3 16 4.5-4.5a2 2 0 0 1 2.8 0L15 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.3" cy="9" r="1.5" stroke="currentColor" stroke-width="1.8"/></svg>
          Galeria
        </button>
      </div>

      <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden-input" />
      <input type="file" id="galleryInput" accept="image/*" class="hidden-input" />

      <p class="privacy-note">A foto é analisada e descartada — nada fica salvo.</p>
    </main>

  </div>

  <!-- Bottom sheet de resultado -->
  <div class="sheet-backdrop hidden" id="sheetBackdrop"></div>
  <section class="sheet hidden" id="resultSheet" aria-live="polite">
    <div class="sheet-handle"></div>

    <div class="sheet-header">
      <span class="sheet-eyebrow" id="sheetEyebrow">Resultado do escaneamento</span>
      <button class="sheet-close" id="closeSheetBtn" aria-label="Fechar">✕</button>
    </div>

    <div class="totals-row">
      <div class="donut-wrap">
        <svg viewBox="0 0 120 120" class="donut-svg">
          <circle cx="60" cy="60" r="50" class="donut-track" />
          <circle cx="60" cy="60" r="50" class="donut-seg donut-protein" id="segProtein" />
          <circle cx="60" cy="60" r="50" class="donut-seg donut-carbs" id="segCarbs" />
          <circle cx="60" cy="60" r="50" class="donut-seg donut-fat" id="segFat" />
        </svg>
        <div class="donut-center">
          <span class="donut-kcal" id="totalKcal">0</span>
          <span class="donut-kcal-label">kcal</span>
        </div>
      </div>

      <div class="macro-legend">
        <div class="macro-row">
          <span class="macro-dot dot-protein"></span>
          <span class="macro-name">Proteína</span>
          <span class="macro-value" id="totalProtein">0g</span>
        </div>
        <div class="macro-row">
          <span class="macro-dot dot-carbs"></span>
          <span class="macro-name">Carboidrato</span>
          <span class="macro-value" id="totalCarbs">0g</span>
        </div>
        <div class="macro-row">
          <span class="macro-dot dot-fat"></span>
          <span class="macro-name">Gordura</span>
          <span class="macro-value" id="totalFat">0g</span>
        </div>
      </div>
    </div>

    <div class="items-list" id="itemsList">
      <!-- itens preenchidos via JS -->
    </div>

    <button class="btn btn-primary btn-block" id="scanAgainBtn">Escanear outro prato</button>
  </section>

  <!-- Toast de erro -->
  <div class="toast hidden" id="errorToast"></div>

  <script src="script.js"></script>
</body>
</html>
